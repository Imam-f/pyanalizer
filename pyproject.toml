[project]
name = "pyanalyzer"
version = "0.1.0"
description = "A small, explainable static type and closure analyzer for Python source"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyanalyzer contributors" }]
dependencies = []

[project.scripts]
pyanalyzer = "pyanalyzer.cli:main"
pyanalyzer-gui = "pyanalyzer.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyanalyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
